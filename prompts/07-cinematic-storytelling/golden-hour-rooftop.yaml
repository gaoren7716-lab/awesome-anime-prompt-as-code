id: golden-hour-rooftop-v1
title: 黄昏天台
version: v1.0
category: [cinematic]
tags: [黄昏, 青春, 告别]
description: golden hour + 天台 + 风；遗憾增强版见 notes。
input_variables:
  subject: { default: "a girl with wind-blown hair", description: "画面主体" }
style:
  base_system_en: ["Japanese anime", "modern anime"]
  rendering_en: ["semi-realistic anime", "soft shading"]
cinematography:
  lighting_en: ["golden hour", "warm sunset light", "long shadows", "warm orange sky"]
  camera_en: ["medium shot"]
  environment_en: ["Japanese high school rooftop", "gentle wind"]
  mood_en: ["nostalgic youthful atmosphere", "cinematic color grading"]
prompt_template: |
