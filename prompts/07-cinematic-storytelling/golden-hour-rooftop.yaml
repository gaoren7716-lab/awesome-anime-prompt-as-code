  Japanese anime, modern anime,
  semi-realistic anime, soft shading,
  golden hour, warm sunset light, long shadows, warm orange sky,
  medium shot, Japanese high school rooftop,
  gentle wind, wind-blown hair,
  nostalgic youthful atmosphere, cinematic color grading
negative_prompt: ["harsh midday sun", "cold blue tones", "empty expressionless face", "text", "watermark"]
suggested_settings:
  aspect_ratio: "16:9"
platforms: ["gpt-image-2", "midjourney-niji", "flux", "sdxl", "jimeng-kling"]
notes_zh: 遗憾增强：追加 empty rooftop, faded colors, bittersweet mood。
