id: mecha-v1
title: 机甲
version: v1.0
category: [special]
tags: [机甲, 科幻战斗]
description: mechanical details + industrial hangar，避免玩具感。
input_variables:
  subject: { default: "a colossal humanoid mech powering up", description: "画面主体" }
style:
  base_system_en: ["mecha anime"]
  rendering_en: ["semi-realistic anime", "detailed rendering", "mechanical details"]
cinematography:
  lighting_en: ["dramatic lighting", "hard lighting"]
  camera_en: ["low angle shot", "dynamic action shot"]
  environment_en: ["industrial hangar", "futuristic battlefield"]
  mood_en: ["epic mood", "high-energy atmosphere"]
prompt_template: |
  {{subject}},
  mecha anime, giant robot, mechanical details,
  semi-realistic anime, detailed rendering,
  dramatic lighting, hard lighting,
  low angle shot, dynamic action shot,
  industrial hangar, futuristic battlefield,
  epic mood, high-energy atmosphere
negative_prompt: ["toy-like proportions", "round cute robot", "clean studio backdrop", "text", "watermark"]
suggested_settings:
  aspect_ratio: "16:9"
platforms: ["gpt-image-2", "midjourney-niji", "sdxl", "jimeng-kling"]
