# 案例 09：JRPG 角色卡组合 —— 甲方要"游戏原画感"时的首选配方
# 来源：作者《动漫Prompt系列03》原创组合，下方示例图即由该提示词生成（MIT 授权）
# 预览图：images/jrpg-card-01.jpg、images/jrpg-card-02.jpg
# 用法：纯风格组合可直接复制使用；需要指定角色时，在提示词最前面加一句主体描述即可。
template_ref: prompts/05-game-character/jrpg-card.yaml

style:
  base_system_en: ["Japanese anime", "JRPG character art", "fantasy game aesthetic"]
  rendering_en: ["painterly anime", "rich brush strokes"]

cinematography:
  lighting_en: ["dramatic lighting", "rim lighting"]
  camera_en: ["full body shot"]
  environment_en: ["fantasy background", "ornate costume"]
  mood_en: ["epic mood", "heroic atmosphere"]

composition_notes: 全身构图，服装与武器细节给足戏份；背景氛围化处理但不抢角色主体。

# ---------- GPT-Image-2（指令式，负面词改写为规避句） ----------
gpt_image_2: |
  Japanese anime, JRPG character art, fantasy game aesthetic,
  painterly anime, rich brush strokes,
  dramatic lighting, rim lighting,
  full body shot,
  fantasy background, ornate costume,
  epic mood, heroic atmosphere.
  Do not include: cropped limbs, flat lighting, modern clothing, text, watermark.

# ---------- Midjourney Niji ----------
midjourney_niji: |
  Japanese anime, JRPG character art, fantasy game aesthetic, painterly anime,
  rich brush strokes, dramatic lighting, rim lighting, full body shot,
  fantasy background, ornate costume, epic mood, heroic atmosphere
  --niji 6 --ar 2:3 --no cropped limbs, flat lighting, modern clothing, text, watermark

# ---------- SDXL ----------
sdxl:
  positive: |
    Japanese anime, JRPG character art, fantasy game aesthetic, painterly anime,
    rich brush strokes, dramatic lighting, rim lighting, full body shot,
    fantasy background, ornate costume, epic mood, heroic atmosphere,
    masterpiece, best quality
  negative: |
    cropped limbs, flat lighting, modern clothing, text, watermark,
    extra fingers, malformed hands, low resolution
  settings: { steps: 30, cfg: 6.0, sampler: "DPM++ 2M Karras" }
